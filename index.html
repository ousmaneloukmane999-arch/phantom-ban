<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalement WhatsApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: #0f1923; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .card { background: #1a2c38; padding: 30px; border-radius: 12px; border: 1px solid #2a3e4c; width: 100%; max-width: 450px; }
  h1 { color: #25D366; font-size: 22px; margin-bottom: 10px; text-align: center; }
  p { color: #8a9ba8; font-size: 13px; margin-bottom: 25px; text-align: center; line-height: 1.5; }
  
  .input-group { margin-bottom: 15px; }
  label { display: block; font-size: 12px; color: #8a9ba8; margin-bottom: 5px; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a3e4c; background: #0f1923; color: #fff; font-size: 14px; outline: none; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: #25D366; }
  
  button { width: 100%; padding: 15px; background: #25D366; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
  button:hover { background: #1da851; }
  
  .preview { background: #0f1923; border: 1px solid #2a3e4c; padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 12px; color: #8a9ba8; display: none; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="card">
  <h1>Signalement WhatsApp</h1>
  <p>Remplissez ce formulaire pour générer une plainte officielle à envoyer au support WhatsApp.</p>
  
  <div class="input-group">
    <label>Numéro à signaler (avec indicatif)</label>
    <input type="tel" id="target" placeholder="Ex: +227 92 00 00 00">
  </div>

  <div class="input-group">
    <label>Motif du signalement</label>
    <select id="reason">
      <option value="Arnaque financière">Arnaque financière</option>
      <option value="Menaces et harcèlement">Menaces et harcèlement</option>
      <option value="Usurpation d'identité">Usurpation d'identité</option>
      <option value="Spam massif">Spam massif</option>
      <option value="Contenu illégal">Contenu illégal</option>
    </select>
  </div>

  <div class="input-group">
    <label>Détails (optionnel)</label>
    <textarea id="details" rows="3" placeholder="Décrivez brièvement ce qui s'est passé..."></textarea>
  </div>

  <button onclick="generateEmail()">Générer la plainte</button>
  
  <div class="preview" id="preview"></div>
  <button id="sendBtn" style="display:none; background: #0071e3; margin-top: 15px;" onclick="sendEmail()">Ouvrir l'application Mail</button>
</div>

<script>
let emailBody = "";

function generateEmail() {
  const target = document.getElementById('target').value;
  const reason = document.getElementById('reason').value;
  const details = document.getElementById('details').value;
  
  if (!target) {
    alert("Veuillez entrer le numéro à signaler.");
    return;
  }

  // Construction du corps de l'email
  emailBody = `À l'attention de l'équipe de modération WhatsApp,

Je souhaite signaler un compte WhatsApp qui enfreint vos conditions d'utilisation.

Numéro concerné : ${target}
Motif : ${reason}
${details ? "Détails : " + details : ""}

Ce numéro est utilisé pour des activités malveillantes. Je vous demande de bien vouloir suspendre ce compte dans les plus brefs délais pour la sécurité de la communauté.

En vous remerciant par avance pour votre traitement.

Cordialement,
Un utilisateur soucieux de sa sécurité.`;

  // Affichage de l'aperçu
  document.getElementById('preview').innerText = emailBody;
  document.getElementById('preview').style.display = 'block';
  document.getElementById('sendBtn').style.display = 'block';
}

function sendEmail() {
  const subject = encodeURIComponent("Signalement de compte WhatsApp malveillant");
  const body = encodeURIComponent(emailBody);
  
  // Ouvre le client mail de l'utilisateur
  window.location.href = `mailto:support@whatsapp.com?subject=${subject}&body=${body}`;
}
</script>

</body>
</html>
